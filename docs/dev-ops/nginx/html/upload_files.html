<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files</title>

    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/images/favicon.ico" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-50">

<!-- Upload File Modal -->
<div class="bg-white p-6 rounded-lg shadow-lg w-96 relative fade-in">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden absolute inset-0 bg-white bg-opacity-90 flex flex-col items-center justify-center rounded-lg z-50">
        <div class="spinner mb-4">
            <svg class="h-10 w-10 text-purple-600" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 18V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M4.93 4.93L7.76 7.76" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M16.24 16.24L19.07 19.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M2 12H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M18 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M4.93 19.07L7.76 16.24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M16.24 7.76L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        <p class="text-gray-600">Uploading files, please wait...</p>
    </div>

    <div class="flex items-center justify-center mb-6">
        <div class="bg-purple-600 rounded-lg p-1">
            <i class="fas fa-cloud-upload-alt text-white text-2xl p-2"></i>
        </div>
    </div>

    <h2 class="text-xl font-semibold text-center mb-6">Add Knowledge Base</h2>

    <form id="uploadForm" enctype="multipart/form-data">
        <!-- Knowledge Title Input -->
        <div class="mb-4">
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Knowledge Title</label>
            <input
                    type="text"
                    id="title"
                    name="title"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all"
                    placeholder="Enter knowledge title"
                    required
            />
        </div>

        <!-- Upload Files Area -->
        <div class="mb-4">
            <label for="file" class="block text-sm font-medium text-gray-700 mb-1">Upload Files</label>
            <div class="mt-1 border-dashed border-2 border-gray-300 rounded-lg p-4 text-center">
                <input type="file" id="file" name="file" accept=".pdf,.csv,.txt,.md,.sql,.java" class="hidden" multiple />
                <label for="file" class="cursor-pointer flex flex-col items-center">
                    <i class="fas fa-file-upload text-purple-500 text-3xl mb-2"></i>
                    <span class="text-gray-700">Drag files here or click to browse</span>
                    <span class="text-sm text-gray-500 mt-1">Supported files: .pdf, .csv, .txt, .md, .sql, .java</span>
                </label>
            </div>
        </div>

        <!-- File List -->
        <div class="mb-6 max-h-40 overflow-y-auto" id="fileList">
            <ul class="divide-y divide-gray-200"></ul>
        </div>

        <!-- Submit Button -->
        <button
                type="submit"
                class="w-full py-2 px-4 bg-gradient-to-r from-purple-500 to-purple-700 text-white rounded-lg hover:opacity-90 transition-all focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
        >
            <i class="fas fa-upload mr-2"></i> Upload Files
        </button>
    </form>
</div>

<script>
    const fileListElement = document.querySelector('#fileList ul');

    // File selection change handler
    document.getElementById('file').addEventListener('change', function (e) {
        const files = Array.from(e.target.files);
        fileListElement.innerHTML = ''; // Clear the list
        files.forEach((file, index) => {
            const listItem = document.createElement('li');
            listItem.className = 'flex justify-between items-center';
            listItem.innerHTML = `
        <span>${file.name}</span>
        <button type="button" class="text-red-500 hover:text-red-700" onclick="removeFile(${index})">Delete</button>
      `;
            fileListElement.appendChild(listItem);
        });
    });

    // Remove file
    function removeFile(index) {
        const input = document.getElementById('file');
        let files = Array.from(input.files);
        files.splice(index, 1);

        // Create a new DataTransfer object
        const dataTransfer = new DataTransfer();
        files.forEach(file => dataTransfer.items.add(file));

        // Update the file list of the input element
        input.files = dataTransfer.files;

        // Update the UI file list
        const fileListItems = fileListElement.children;
        fileListItems[index].remove();
    }

    // Submit handler
    document.getElementById('uploadForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const loadingOverlay = document.getElementById('loadingOverlay');
        const input = document.getElementById('file');
        const files = Array.from(input.files);

        if (files.length === 0) {
            alert('Please select at least one file');
            return;
        }

        // Show loading state
        loadingOverlay.classList.remove('hidden');

        const formData = new FormData();
        formData.append('ragTag', document.getElementById('title').value);
        files.forEach(file => formData.append('file', file));

        axios.post('http://188.245.233.12:8090/api/v1/rag/file/upload', formData)
            .then(response => {
                if (response.data.code === '0000') {
                    // Success message and close window
                    setTimeout(() => {
                        alert('Upload successful. This window will close shortly.');
                        window.close();
                    }, 500);
                } else {
                    throw new Error(response.data.info || 'Upload failed');
                }
            })
            .catch(error => {
                alert(error.message);
            })
            .finally(() => {
                // Hide loading state
                loadingOverlay.classList.add('hidden');

                // Clear the form (whether successful or not)
                input.value = '';
                document.getElementById('title').value = '';
                fileListElement.innerHTML = '';
            });
    });
</script>
</body>
</html>
