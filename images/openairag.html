<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisa-ai-rag-knowledge</title>

    <!-- (Favicon) -->
    <link rel="icon" href="/openairag/images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/openairag/images/favicon.ico" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* Typing indicator */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
        }

        .typing-indicator span {
            height: 6px;
            width: 6px;
            margin: 0 1px;
            background-color: #9880ff;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.7;
        }

        .typing-indicator span:nth-child(1) {
            animation: pulse 1.5s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation: pulse 1.5s infinite ease-in-out 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation: pulse 1.5s infinite ease-in-out 0.4s;
        }

        @keyframes pulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        /* message style */
        .message-content p {
            margin-bottom: 0.75rem;
        }

        .message-content ul, .message-content ol {
            margin-left: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .message-content ul {
            list-style-type: disc;
        }

        .message-content ol {
            list-style-type: decimal;
        }

        .message-content h1, .message-content h2, .message-content h3 {
            font-weight: bold;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .message-content h1 {
            font-size: 1.5rem;
        }

        .message-content h2 {
            font-size: 1.25rem;
        }

        .message-content h3 {
            font-size: 1.1rem;
        }

        .message-content code {
            background-color: rgba(0, 0, 0, 0.05);
            padding: 0.1rem 0.3rem;
            border-radius: 0.25rem;
            font-family: monospace;
        }

        .message-content pre {
            background-color: rgba(0, 0, 0, 0.05);
            padding: 0.75rem;
            border-radius: 0.25rem;
            overflow-x: auto;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen font-sans">
<div class="container mx-auto max-w-4xl h-screen flex flex-col p-4">
    <!-- Header -->
    <div class="bg-white rounded-t-xl shadow-sm p-4 border-b border-gray-200">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">

                <div class="bg-purple-600 rounded-lg flex items-center justify-center" style="padding: 0.5px;">
                    <img src="/openairag/images/lisa.png" alt="lisa" width="64" height="64" class="object-contain">
                </div>
                <h1 class="text-xl font-semibold text-gray-800">AI-rag-knowledge Assistant</h1>
            </div>

            <!-- Model selector -->
            <div class="relative">
                <select id="modelSelector" class="appearance-none bg-gray-50 border border-gray-300 text-gray-700 py-2 px-3 pr-8 rounded-lg leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <option value="deepseek-r1:1.5b">deepseek-r1:1.5b</option>
                    <option value="llama2:7b">llama2:7b</option>
                    <option value="mistral:7b">mistral:7b</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                    <i class="fas fa-chevron-down text-xs"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Messages container -->
    <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-white border-l border-r border-gray-200">
        <!-- Welcome message -->
        <div class="flex justify-start fade-in">
            <div class="max-w-[80%] p-3 rounded-lg bg-gray-100 text-gray-800 shadow-sm message-content">
                <p>Hello! I'm AI-rag-knowledge assistant. How can I help you today?</p>
            </div>
        </div>
    </div>

    <!-- Input area -->
    <div class="bg-white rounded-b-xl shadow-sm p-4 border-t border-gray-200">
        <div class="flex items-center space-x-2">
            <div class="relative flex-1">
                <input
                        type="text"
                        id="messageInput"
                        placeholder="Type your message..."
                        class="w-full p-3 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                        onkeypress="handleKeyPress(event)"
                >
            </div>
            <button
                    onclick="sendMessage()"
                    id="sendButton"
                    class="p-3 bg-gradient-to-r from-purple-500 to-purple-700 text-white rounded-lg hover:opacity-90 transition-all focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
            >
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script>
    function addMessage(content, isUser = false) {
        const container = document.getElementById('messageContainer');
        const messageDiv = document.createElement('div');

        messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} fade-in`;

        const bubbleClass = isUser
            ? 'bg-gradient-to-r from-purple-500 to-purple-700 text-white shadow-md'
            : 'bg-gray-100 text-gray-800 shadow-sm message-content';

        messageDiv.innerHTML = `
                <div class="max-w-[80%] p-3 rounded-lg ${bubbleClass}">
                    ${content}
                </div>
            `;

        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight; // 滚动到底部
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        const sendButton = document.getElementById('sendButton');

        if (!message) return;

        sendButton.disabled = true;
        sendButton.classList.add('opacity-50');

        input.value = '';

        addMessage(message, true);

        const typingIndicator = `
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
        addMessage(typingIndicator);

        const modelSelector = document.getElementById('modelSelector');
        const selectedModel = modelSelector.value;

        // API URL
        const systemPrompt = encodeURIComponent("You are a helpful assistant. Always respond in English.");
        const apiUrl = `http://localhost:8090/api/v1/ollama/generate_stream?model=${encodeURIComponent(selectedModel)}&message=${encodeURIComponent(message)}`;

        const eventSource = new EventSource(apiUrl);
        let buffer = '';

        eventSource.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                const result = Array.isArray(data) ? data[0].result : data.result;

                if (!result) {
                    console.error('Invalid response format:', data);
                    return;
                }

                const content = result.output?.content || '';
                const finishReason = result.metadata?.finishReason;

                // if (content) {
                //     buffer += content;
                //
                //     const formattedContent = formatMessage(buffer) + `
                //             <div class="typing-indicator inline-block ml-1">
                //                 <span></span>
                //                 <span></span>
                //                 <span></span>
                //             </div>
                //         `;
                //     updateLastMessage(formattedContent);
                // }
                if (content) {
                    buffer += content;
                    // no typing-indicator
                    const formattedContent = formatMessage(buffer);
                    updateLastMessage(formattedContent);
                }

                if (finishReason === 'STOP') {
                    eventSource.close();
                    const finalFormattedContent = formatMessage(buffer);
                    updateLastMessage(finalFormattedContent); // 移除加载动画

                    sendButton.disabled = false;
                    sendButton.classList.remove('opacity-50');
                }
            } catch (error) {
                console.error('Parsing error:', error);
                eventSource.close();

                sendButton.disabled = false;
                sendButton.classList.remove('opacity-50');
            }
        };

        eventSource.onerror = (error) => {
            console.error('EventSource error:', error);
            eventSource.close();

            sendButton.disabled = false;
            sendButton.classList.remove('opacity-50');
        };
    }

    function formatMessage(content) {
        // Markdown
        let formatted = content;

        formatted = formatted.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
        formatted = formatted.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
        formatted = formatted.replace(/^### (.*?)$/gm, '<h3>$1</h3>');

        formatted = formatted.replace(/^\* (.*?)$/gm, '<li>$1</li>');
        formatted = formatted.replace(/^- (.*?)$/gm, '<li>$1</li>');
        formatted = formatted.replace(/^(\d+)\. (.*?)$/gm, '<li>$2</li>');

        formatted = formatted.replace(/(<li>.*?<\/li>)\n(<li>.*?<\/li>)/gs, '<ul>$1$2</ul>');

        formatted = formatted.replace(/\n\n/g, '</p><p>');

        formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');

        if (!formatted.startsWith('<')) {
            formatted = '<p>' + formatted;
        }
        if (!formatted.endsWith('>')) {
            formatted = formatted + '</p>';
        }

        return formatted;
    }

    function updateLastMessage(content) {
        const container = document.getElementById('messageContainer');
        const lastMessage = container.lastChild.querySelector('div');
        lastMessage.innerHTML = content;
        container.scrollTop = container.scrollHeight;
    }

    // Enter send
    function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }
</script>
</body>
</html>
